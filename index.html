<style>
/* =====================================================================
   Breathing Room — ADHD Budget & Planner
   1. TOKENS — themes: linen (light), night (dark), harvest, frost
   ===================================================================== */
:root, [data-theme="linen"] {
  --bg: #F6F2EA; --desk: #ECE5D8; --paper: #FFFDF8; --surface-2: #F2EDE3; --surface-3: #E8E0D1;
  --line: #E5DCCC; --line-strong: #CDBFA9;
  --ink: #29261F; --ink-2: #3D392F; --muted: #625B4F; --faint: #8C8475;
  --accent: #2F6A5C; --accent-deep: #23524A; --accent-soft: #E1EEE8; --on-accent: #FFFFFF; --ring: rgba(47,106,92,.3);
  --sun: #F2B47A; --sun-soft: #FCE6CF;
  --good: #3B7550; --good-soft: #E3F0E5;
  --gentle: #A0573D; --gentle-soft: #F8E6DC;
  --sky-soft: #E1ECF4; --plum-soft: #EEE7F2;
  --hero: linear-gradient(135deg, #FCE7D2 0%, #FBF3E6 48%, #E1EEE6 100%);
  --banner: linear-gradient(118deg, #1E2B27 0%, #25332E 55%, #2E3A2E 100%);
  --banner-ink: #F6F1E6; --banner-muted: #C9CFC4;
  --shadow: 0 22px 40px -32px rgba(62,48,26,.5), 0 1px 2px rgba(62,48,26,.05);
  --shadow-lg: 0 30px 70px -24px rgba(40,32,20,.45);
  --scrim: rgba(41,38,31,.38);
  --grain: rgba(90,66,30,.045);
  color-scheme: light;
}
[data-theme="night"] {
  --bg: #111816; --desk: #0B100F; --paper: #18211E; --surface-2: #1F2A27; --surface-3: #283531;
  --line: #2C3935; --line-strong: #41524C;
  --ink: #F1EDE3; --ink-2: #DCD8CD; --muted: #AAB4AD; --faint: #7F8B85;
  --accent: #8CCFBA; --accent-deep: #AEDFCF; --accent-soft: rgba(140,207,186,.13); --on-accent: #0E1A16; --ring: rgba(140,207,186,.35);
  --sun: #F0B47E; --sun-soft: rgba(240,180,126,.16);
  --good: #9BD8AF; --good-soft: rgba(155,216,175,.12);
  --gentle: #F1AB91; --gentle-soft: rgba(241,171,145,.12);
  --sky-soft: rgba(143,190,224,.13); --plum-soft: rgba(196,170,224,.12);
  --hero: linear-gradient(135deg, #2B261F 0%, #1D2623 50%, #163029 100%);
  --banner: linear-gradient(118deg, #22302B 0%, #1B2A2A 55%, #233127 100%);
  --banner-ink: #F6F1E6; --banner-muted: #B9C3BC;
  --shadow: 0 22px 40px -30px rgba(0,0,0,.7), 0 1px 2px rgba(0,0,0,.3);
  --shadow-lg: 0 30px 70px -20px rgba(0,0,0,.75);
  --scrim: rgba(4,8,7,.62);
  --grain: rgba(255,255,255,.025);
  color-scheme: dark;
}
[data-theme="harvest"] {
  --bg: #F7F0E6; --desk: #EDE1CF; --paper: #FFFCF6; --surface-2: #F3EADC; --surface-3: #EADCC6;
  --line: #E6D8C2; --line-strong: #D0BB9B;
  --accent: #8C4A27; --accent-deep: #6F391C; --accent-soft: #F5E4D6; --ring: rgba(140,74,39,.3);
  --sun: #E2A445; --sun-soft: #F9E5C2;
  --hero: linear-gradient(135deg, #FADFC2 0%, #FAF1E1 50%, #EEE5CC 100%);
  --banner: linear-gradient(118deg, #2F2119 0%, #3A281D 55%, #3B2F1E 100%);
}
[data-theme="frost"] {
  --bg: #F3F6F8; --desk: #E3E9EE; --paper: #FFFFFF; --surface-2: #EDF1F5; --surface-3: #E1E8EF;
  --line: #DCE3EA; --line-strong: #BCC8D4;
  --ink: #232A33; --ink-2: #36404B; --muted: #56616D;
  --accent: #35567E; --accent-deep: #284364; --accent-soft: #E2EAF4; --ring: rgba(53,86,126,.3);
  --sun: #9CC3E6; --sun-soft: #DFEDF8;
  --hero: linear-gradient(135deg, #E3EDF8 0%, #F6F8FB 50%, #E5F1EE 100%);
  --banner: linear-gradient(118deg, #1B2433 0%, #1F2C40 55%, #233349 100%);
  --grain: rgba(40,60,90,.035);
}
:root {
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --r: 20px; --r-md: 14px; --r-sm: 10px; --pill: 999px;
  --side: 240px; --scale: 1;
  --ease: cubic-bezier(.2,.7,.2,1);
}

/* =====================================================================
   2. BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: calc(15px * var(--scale)); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; font-family: var(--font-ui); font-size: 1rem; line-height: 1.5;
  color: var(--ink); background-color: var(--bg);
  background-image: radial-gradient(var(--grain) .7px, transparent .8px);
  background-size: 5px 5px;
  -webkit-font-smoothing: antialiased;
}
body.has-layer { overflow: hidden; }
h1, h2, h3, h4, p { margin: 0; }
a { color: var(--accent-deep); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--muted); }
.soft { font-family: var(--font-display); font-style: italic; color: var(--muted); font-weight: 400; }
.num { font-variant-numeric: tabular-nums; }
.label {
  font-size: .74rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.serif { font-family: var(--font-display); }
.good { color: var(--good); } .gentle { color: var(--gentle); }

/* =====================================================================
   3. LAYOUT
   ===================================================================== */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 16px 22px;
  border-right: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 62%, transparent);
  display: flex; flex-direction: column; gap: 18px;
}
.mainwrap { min-width: 0; }
.main { padding: 8px 34px 90px; max-width: 1260px; margin: 0 auto; }
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 16px 34px; max-width: 1260px; margin: 0 auto;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
}
.top-l { min-width: 0; }
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.greet { font-family: var(--font-display); font-size: 1.55rem; font-weight: 500; line-height: 1.2; letter-spacing: -.01em; }
.top-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.tbtn {
  display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 13px; border-radius: var(--pill);
  border: 1px solid var(--line); background: var(--paper); font-size: .87rem; font-weight: 600; color: var(--ink-2);
}
.tbtn:hover { border-color: var(--line-strong); }
.tbtn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tbtn.icon { width: 38px; padding: 0; justify-content: center; }
kbd { font: 600 .68rem var(--font-ui); padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.tbtn.on kbd { background: transparent; color: inherit; }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; align-items: start; }
.s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; }
.s5 { grid-column: span 5; } .s4 { grid-column: span 4; } .s3 { grid-column: span 3; }
.stack { display: grid; gap: 18px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* Screen header — highlighter underline is the signature */
.screen-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 6px 0 22px; }
.screen-h h1 { font-family: var(--font-display); font-weight: 500; font-size: 2.35rem; line-height: 1.1; letter-spacing: -.02em; }
.hl { background: linear-gradient(transparent 60%, var(--sun-soft) 60%, var(--sun-soft) 94%, transparent 94%); padding: 0 .08em; }
.screen-h p { margin-top: 6px; }

/* =====================================================================
   4. CARDS & PIECES
   ===================================================================== */
.card {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px;
  box-shadow: var(--shadow); min-width: 0;
}
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h2, .card-h h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.22rem; letter-spacing: -.01em; }
.card-t { font-family: var(--font-display); font-weight: 500; font-size: 1.22rem; }
.card.flat { box-shadow: none; }
.card.tint { background: var(--surface-2); box-shadow: none; }
.empty { padding: 18px; border: 1.5px dashed var(--line-strong); border-radius: var(--r-md); text-align: center; }
.empty .soft { display: block; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 16px;
  border-radius: var(--pill); border: 1px solid var(--line-strong); background: var(--paper); font-weight: 650; font-size: .92rem;
  color: var(--ink); transition: transform .15s var(--ease), background .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: .84rem; }
.btn.block { width: 100%; }
.btn.light { background: rgba(255,255,255,.12); color: var(--banner-ink); border-color: rgba(255,255,255,.2); }
.btn.light:hover { background: rgba(255,255,255,.2); }
.btn.sun { background: var(--sun); border-color: var(--sun); color: #2A1E10; }
.link { background: none; border: 0; padding: 0; color: var(--accent-deep); font-weight: 650; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.ibtn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 50%; border: 0; background: transparent; color: var(--muted); }
.ibtn:hover { background: var(--surface-2); color: var(--ink); }

.chip {
  --c-bg: #EEE; --c-ink: #333; --c-dot: #999;
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: var(--pill);
  background: var(--c-bg); color: var(--c-ink); font-weight: 650; font-size: .82rem; border: 1px solid transparent; white-space: nowrap;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c-dot); flex: none; }
button.chip:hover { border-color: var(--c-dot); }
button.chip.sel { border-color: var(--c-ink); box-shadow: 0 0 0 2px var(--c-dot) inset; }
[data-theme="night"] .chip { background: color-mix(in srgb, var(--c-dot) 22%, transparent); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: var(--pill); font-size: .72rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; background: var(--surface-2); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.todo { background: var(--sun-soft); color: var(--ink-2); }
.pill.calm { background: var(--accent-soft); color: var(--accent-deep); }
.pill.gentle { background: var(--gentle-soft); color: var(--gentle); }

.bar { height: 9px; border-radius: var(--pill); background: var(--surface-3); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: var(--pill); transition: width .5s var(--ease); }
.bar.multi > span { border-radius: 0; }
.bar.thin { height: 6px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.tile { border-radius: var(--r-md); padding: 14px 16px; background: var(--surface-2); }
.tile .v { font-family: var(--font-display); font-size: 1.45rem; font-weight: 500; margin-top: 2px; }
.tile.in { background: var(--good-soft); } .tile.out { background: var(--gentle-soft); }
.tile.kept { background: var(--accent-soft); } .tile.left { background: var(--sky-soft); }

.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .t { font-weight: 650; }
.li .sub { font-size: .84rem; color: var(--muted); }
.li .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.li .acts { display: flex; gap: 2px; }
.dayhead { font-size: .74rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 14px 0 2px; }
.datebadge { width: 46px; flex: none; text-align: center; border-radius: 12px; background: var(--surface-2); padding: 5px 0; line-height: 1.05; }
.datebadge b { display: block; font-family: var(--font-display); font-size: 1.25rem; font-weight: 500; }
.datebadge small { font-size: .66rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.datebadge.paid { opacity: .6; }

/* =====================================================================
   5. SIDEBAR
   ===================================================================== */
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand .logo { width: 36px; height: 36px; flex: none; }
.brand b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1.08rem; letter-spacing: -.01em; line-height: 1.15; }
.brand small { display: block; font-size: .75rem; color: var(--muted); line-height: 1.3; }
.nav { display: grid; gap: 2px; }
.nav-i {
  display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 12px; border-radius: 12px; border: 0; background: transparent;
  font-weight: 600; font-size: .93rem; color: var(--ink-2); text-align: left;
}
.nav-i:hover { background: var(--surface-2); }
.nav-i.on { background: var(--accent-soft); color: var(--accent-deep); }
.nav-i .ico { width: 1.2em; height: 1.2em; }
.nav-i .count { margin-left: auto; font-size: .72rem; font-weight: 750; background: var(--sun-soft); color: var(--ink-2); border-radius: var(--pill); padding: 1px 8px; }
.side-box { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; background: var(--paper); display: grid; gap: 10px; }
.side-box .chips .chip { font-size: .78rem; padding: 3px 9px; }
.side-foot { margin-top: auto; display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); font-size: .82rem; }
.side-foot b { display: block; font-size: .86rem; }
.side-foot small { color: var(--muted); }
.side-foot .ico { color: var(--accent); margin-top: 2px; }

/* =====================================================================
   6. TODAY
   ===================================================================== */
.ribbon {
  max-width: 1260px; margin: 0 auto 12px; padding: 0 34px;
}
.ribbon > div {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; border-radius: var(--r-md);
  background: var(--sun-soft); color: var(--ink-2); font-size: .9rem;
}
.ribbon .grow { min-width: 200px; }

.now {
  background: var(--banner); color: var(--banner-ink); border-radius: var(--r); padding: 20px 24px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap; box-shadow: var(--shadow); border: 0;
}
.now .label { color: var(--banner-muted); }
.now .n { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none;
  border: 2px solid var(--sun); color: var(--sun); font-family: var(--font-display); font-size: 1.35rem; font-weight: 500; }
.now .what { font-family: var(--font-display); font-size: 1.45rem; font-weight: 500; line-height: 1.25; margin-top: 2px; }
.now .time { display: inline-block; margin-left: 8px; font: 650 .78rem var(--font-ui); padding: 2px 9px; border-radius: var(--pill); background: rgba(255,255,255,.12); color: var(--banner-muted); vertical-align: middle; }
.now .acts { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.now.done .what { font-style: italic; }

.hero { background: var(--hero); border-color: transparent; padding: 26px 28px 22px; position: relative; overflow: hidden; }
.hero::after { /* soft "breath" rings — decorative */
  content: ""; position: absolute; right: -90px; top: -90px; width: 300px; height: 300px; border-radius: 50%;
  border: 1.5px solid color-mix(in srgb, var(--accent) 16%, transparent);
  box-shadow: 0 0 0 34px color-mix(in srgb, var(--accent) 4%, transparent), 0 0 0 70px color-mix(in srgb, var(--accent) 3%, transparent);
  pointer-events: none;
}
.big { font-family: var(--font-display); font-weight: 500; font-size: clamp(3.2rem, 7vw, 5.4rem); line-height: 1; letter-spacing: -.035em; margin: 10px 0 8px; font-variant-numeric: lining-nums tabular-nums; }
.big .cents { color: var(--accent); font-size: .5em; vertical-align: .75em; letter-spacing: 0; margin-left: .04em; }
.big.dim { color: var(--muted); }
.hero .soft { font-size: 1.04rem; max-width: 46ch; }
.hero .bar { margin: 16px 0 10px; background: color-mix(in srgb, var(--paper) 70%, transparent); max-width: 520px; }
.hero .chips { margin-top: 14px; position: relative; z-index: 1; }
.hero .row { position: relative; z-index: 1; }

.tasks { display: grid; gap: 8px; }
.task { display: flex; gap: 12px; align-items: center; padding: 11px 12px; border-radius: 14px; background: var(--surface-2); border: 0; text-align: left; width: 100%; }
.task .box { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line-strong); display: grid; place-items: center; flex: none; background: var(--paper); color: var(--on-accent); }
.task.done .box { background: var(--accent); border-color: var(--accent); }
.task.done .tt { text-decoration: line-through; text-decoration-color: var(--line-strong); color: var(--muted); }
.task .tt { font-weight: 650; flex: 1; }
.task small { color: var(--muted); font-weight: 600; white-space: nowrap; }

/* Payday path — bead strip */
.beads { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 14px; }
.bead { width: 40px; text-align: center; font-size: .7rem; font-weight: 700; color: var(--muted); }
.bead .b { width: 34px; height: 34px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2);
  font-size: .78rem; font-weight: 700; position: relative; border: 1.5px solid transparent; }
.bead.today .b { background: var(--accent); color: var(--on-accent); }
.bead.pay .b { background: var(--sun); color: #2A1E10; }
.bead.bill .b::after { content: ""; position: absolute; right: -1px; top: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--gentle); border: 2px solid var(--paper); }
.bead.past .b { opacity: .45; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

.spark { display: flex; align-items: flex-end; gap: 3px; height: 92px; padding-top: 6px; }
.spark span { flex: 1; min-width: 3px; background: var(--accent); opacity: .75; border-radius: 4px 4px 2px 2px; min-height: 2px; }
.spark span.we { background: var(--sun); }
.spark span.fut { background: var(--surface-3); opacity: 1; }
.spark span.today { opacity: 1; outline: 2px solid var(--ink); outline-offset: 1px; }

.dump-i { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px dashed var(--line); }

.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.foot-line { text-align: center; margin: 30px 0 0; }

/* =====================================================================
   7. FORMS & SHEETS
   ===================================================================== */
.field { display: grid; gap: 6px; }
.field > span { font-size: .82rem; font-weight: 700; color: var(--ink-2); }
.field small { color: var(--muted); font-size: .8rem; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line-strong);
  background: var(--paper); color: var(--ink); font-size: 1rem;
}
textarea.input { min-height: 90px; resize: vertical; line-height: 1.45; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.form { display: grid; gap: 14px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .93rem; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.check small { display: block; color: var(--muted); }
.seg { display: inline-flex; padding: 3px; border-radius: var(--pill); background: var(--surface-2); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: var(--pill); font-weight: 650; font-size: .86rem; color: var(--muted); }
.seg button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.layer { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: var(--scrim); animation: fade .18s ease; }
.sheet {
  width: min(560px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: var(--paper); border-radius: 24px;
  box-shadow: var(--shadow-lg); padding: 24px; animation: rise .22s var(--ease); border: 1px solid var(--line);
}
.sheet.wide { width: min(760px, 100%); }
.sheet-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.sheet-h h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.6rem; line-height: 1.15; letter-spacing: -.01em; }
.sheet-h p { margin-top: 4px; }
.sheet-f { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }

.amt-display { text-align: center; padding: 18px 10px 8px; border-radius: 18px; background: var(--hero); }
.amt-display .big { font-size: 3.6rem; margin: 2px 0; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.keys button { min-height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 750; font-size: 1rem; }
.keys button:hover { border-color: var(--accent); }

.explain .li { padding: 9px 0; }
.explain .li.total { border-top: 2px solid var(--ink); font-weight: 750; }
.explain .li.sub { padding: 4px 0 4px 18px; border-top: 0; font-size: .88rem; color: var(--muted); }

.palette input { font-size: 1.15rem; }
.pal-list { display: grid; gap: 2px; margin-top: 10px; max-height: 50vh; overflow: auto; }
.pal-i { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; border: 0; background: transparent; text-align: left; width: 100%; font-weight: 600; }
.pal-i small { margin-left: auto; color: var(--muted); font-weight: 600; }
.pal-i.on, .pal-i:hover { background: var(--accent-soft); }

.toasts { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 150; display: grid; gap: 8px; width: max-content; max-width: calc(100vw - 32px); }
.toast { display: flex; align-items: center; gap: 14px; padding: 11px 12px 11px 18px; border-radius: var(--pill); background: var(--ink); color: var(--bg); box-shadow: var(--shadow-lg); font-weight: 600; font-size: .92rem; animation: rise .2s var(--ease); }
.toast button { border: 0; background: rgba(255,255,255,.14); color: inherit; padding: 6px 12px; border-radius: var(--pill); font-weight: 750; }
[data-theme="night"] .toast button { background: rgba(0,0,0,.1); }

/* =====================================================================
   8. MONTH
   ===================================================================== */
/* Month rail — vertical tabs on the right edge, like planner dividers */
.rail { position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 30; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.rail .yr { writing-mode: vertical-rl; font: 800 .66rem var(--font-ui); letter-spacing: .16em; color: var(--muted); margin: 0 9px 6px 0; }
.rail button {
  width: 30px; height: clamp(38px, calc((100vh - 150px) / 12), 64px); padding: 0; border: 0; border-radius: 11px 0 0 11px;
  background: var(--tone); color: #3A3428; display: grid; place-items: center; opacity: .9;
  box-shadow: inset -5px 0 7px -5px rgba(0,0,0,.18); transition: width .18s var(--ease), opacity .18s;
}
.rail button span { writing-mode: vertical-rl; font: 800 .66rem var(--font-ui); letter-spacing: .16em; }
.rail button:hover { width: 37px; opacity: 1; }
.rail button.sel { width: 37px; opacity: 1; box-shadow: inset 3px 0 0 var(--ink), -4px 4px 10px -8px rgba(0,0,0,.4); }
.rail button.now { width: 42px; opacity: 1; background: var(--accent); color: var(--on-accent); box-shadow: -8px 8px 18px -10px rgba(0,0,0,.45); }
.rail button.now.sel { box-shadow: inset 3px 0 0 var(--sun), -8px 8px 18px -10px rgba(0,0,0,.45); }

@media (min-width: 861px) { .mainwrap { padding-right: 46px; } .main .season { display: none; } }
@media (max-width: 860px) { .rail { display: none; } }
.season { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-bottom: 18px; }
.season button { border: 0; padding: 8px 0 7px; border-radius: 10px 10px 4px 4px; font-size: .72rem; font-weight: 800; letter-spacing: .08em; color: #3A3428; opacity: .85; }
.season button:hover { opacity: 1; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }

.cell {

  text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; color: inherit;
}

.cell.today { border-color: var(--accent); background: var(--paper); }
.cell .d { font-family: var(--font-display); font-size: 1.05rem; font-weight: 500; display: flex; justify-content: space-between; align-items: baseline; }
.cell .d small { font: 750 .62rem var(--font-ui); letter-spacing: .1em; color: var(--accent-deep); text-transform: uppercase; }
.ev { font-size: .72rem; font-weight: 650; border-radius: 6px; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 4px; align-items: center; }
.ev.in { background: var(--good-soft); color: var(--good); }
.ev.due { background: var(--paper); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
.ev.paid { background: transparent; color: var(--muted); text-decoration: line-through; }
.ev.sp { color: var(--muted); padding-left: 0; }
.cal-list { display: none; }
@media (min-width: 861px) { .cal-toggle { display: none !important; } }
.note-i { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); display: flex; gap: 10px; align-items: flex-start; }
.note-i p { flex: 1; font-family: var(--font-display); }

/* =====================================================================
   9. GOALS / DEBT / ENVELOPES / WAIT / WINS
   ===================================================================== */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.goal .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
.goal .amt { font-family: var(--font-display); font-size: 1.6rem; font-weight: 500; }
.meta { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: .84rem; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 700; }
.inline-form { display: flex; gap: 8px; }
.inline-form .input { min-height: 40px; }
.rank { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; flex: none; }
.rank.first { background: var(--sun); color: #2A1E10; }

.jar { position: relative; height: 128px; border-radius: 16px 16px 22px 22px; background: var(--surface-2); overflow: hidden; border: 1.5px solid var(--line); }
.jar .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--c-dot, var(--accent)); opacity: .55; transition: height .6s var(--ease); }
.jar .fill::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 12px; border-radius: 50%; background: inherit; }
.jar .in { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 10px; }
.jar .in b { font-family: var(--font-display); font-size: 1.5rem; font-weight: 500; display: block; }
.jar .in small { font-weight: 650; color: var(--ink-2); }

.ring { --p: 0; width: 54px; height: 54px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-3) 0); }
.ring span { width: 42px; height: 42px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; }
.ring.ready { background: var(--sun); }

.win { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: var(--r-md); background: var(--surface-2); }
.win .medal { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); color: var(--faint); flex: none; border: 1.5px dashed var(--line-strong); }
.win.got { background: var(--accent-soft); }
.win.got .medal { background: var(--sun); color: #2A1E10; border: 0; }
.win b { display: block; }

/* Money Minute */
.breath { width: 150px; height: 150px; margin: 6px auto 14px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.breath::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, var(--sun-soft), var(--accent-soft)); animation: breathe 8s ease-in-out infinite; }
.breath b { position: relative; font-family: var(--font-display); font-size: 2.2rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.breath.paused::before { animation-play-state: paused; }
@keyframes breathe { 0%, 100% { transform: scale(.78); } 50% { transform: scale(1); } }

.confetto { position: fixed; width: 7px; height: 11px; border-radius: 2px; pointer-events: none; z-index: 300; animation: pop 1s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes pop { to { transform: translate(var(--dx), calc(var(--dy) + 70px)) rotate(var(--r)); opacity: 0; } }

.tabs-s { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs-s button { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--muted); border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs-s button.on { color: var(--ink); border-color: var(--accent); }
.theme-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.theme-pick button { border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; background: var(--paper); text-align: left; font-weight: 700; font-size: .86rem; }

.theme-pick .sw { height: 46px; border-radius: 9px; margin-bottom: 8px; display: flex; overflow: hidden; }
.theme-pick .sw i { flex: 1; }
.guide h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; margin: 18px 0 6px; }
.guide p, .guide li { color: var(--ink-2); max-width: 70ch; }
.guide ol { padding-left: 1.2em; margin: 6px 0; }
.help-b { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--paper); color: var(--muted); font-size: .75rem; font-weight: 800; display: inline-grid; place-items: center; padding: 0; }

   ===================================================================== */

   ===================================================================== */

  'help.safe': 'Your breathing room is what you can spend today without putting any bill at risk. It takes what’s in checking, holds back every must-pay due before payday, a slice for bigger bills, and any savings you keep out — then shares the rest evenly over the days until payday.',
  'help.runway': 'Each bead is a day. The green one is today, the sun is payday, and a little dot means a must-pay is due. The per-day amount is today’s share before anything is spent.',
  'help.logged': 'Everything you logged in the last week. Tap the pencil to fix an amount or category — mistakes are normal.',
  'help.dump': 'For thoughts that are cluttering your head. Write them here so you can stop holding them. They never affect money.',
  'help.month': 'Came in is money that actually arrived. Went out is spends, paid bills, debt payments and savings. Kept is the difference.',
  'help.bills': 'Everything you owe this month, soonest first. “To pay” bills are due before payday and are already held back from your breathing room.',
  'help.smooth': 'Bills that come every few months are spread out: a little is held back each day, so the big one never ruins a month.',
  'help.leaks': 'ADHD tax is money lost to forgetting — late fees, renewals you didn’t mean, things bought twice. Seeing it is the first step to shrinking it.',
  'help.income': 'Scheduled paychecks count automatically on their date. If one is late, mark it — the number adjusts until it arrives.',
  'help.goals': 'Put in any amount whenever. If your savings sit in your checking account, tick “keep this out” so they’re not counted as spendable.',
  'help.debt': 'Highest rate first saves the most interest. Smallest balance first gives quicker wins. Any extra each month shortens the whole thing.',
  'help.envelopes': 'Soft limits per category. Going over is just shown — no alarms. Caps refill every month.',
  'help.wait': 'Impulse buys lose their pull with time. Park it, let the timer run, then decide calmly.',
  'help.wins': 'Milestones read straight from your data. They can’t be lost, broken or reset.',
  'guide.html': `<h3>The idea</h3><p>One number — your <b>breathing room</b> — tells you what you can spend today without putting a bill at risk. Everything else is optional.</p>
<h3>A calm start</h3><ol><li>Put in what’s in checking.</li><li>Add your usual paycheck.</li><li>Confirm your next payday.</li><li>Add your first must-pay.</li></ol><p>That’s enough for a real number. Add more whenever.</p>
<h3>Every day (about a minute)</h3><p>Follow the dark <b>Right now</b> banner — it only ever shows one thing. Log spends with a quick button, the + keys, voice, or <b>Ctrl/⌘ K</b> and type “12 lunch”. Every action can be undone.</p>
<h3>Bills that come every few months</h3><p>Tick <b>put a bit aside each month</b>. A slice is held back daily, so the bill is covered when it lands — and never counted twice.</p>
<h3>Wait list</h3><p>Want something? Park it for 48 hours. When the timer ends, buy it or let it go. Letting go counts as a win.</p>
<h3>Been away?</h3><p>After a week or more, the planner offers three small steps to catch up — or a clean start from today. No guilt, no backlog.</p>
<h3>Install it like an app</h3><p>iPhone/iPad: open the link in Safari → Share → <i>Add to Home Screen</i>. Android/Chrome/Edge: menu → <i>Install app</i>. It works offline.</p>
<h3>Your data</h3><p>Everything stays in this browser on this device — no account, no bank link, no tracking. Download a backup now and then (Settings → Backup). Clearing browser data clears the planner.</p>`

  'guide.html': `<h3>L’idée</h3><p>Un seul chiffre — ta <b>marge</b> — te dit ce que tu peux dépenser aujourd’hui sans mettre une facture en danger. Tout le reste est facultatif.</p>
<h3>Un départ en douceur</h3><ol><li>Indique ce qu’il y a sur ton compte courant.</li><li>Ajoute ton salaire habituel.</li><li>Confirme ta prochaine paie.</li><li>Ajoute ta première facture.</li></ol><p>Ça suffit pour un vrai chiffre. Ajoute le reste quand tu veux.</p>
<h3>Chaque jour (environ une minute)</h3><p>Suis la bannière sombre <b>Maintenant</b> — elle n’affiche jamais qu’une seule chose. Note tes dépenses avec un bouton rapide, les touches +, la voix, ou <b>Ctrl/⌘ K</b> en tapant « 12 resto ». Tout peut être annulé.</p>
<h3>Les factures espacées</h3><p>Coche <b>mettre un peu de côté chaque mois</b>. Une part est retenue chaque jour, la facture est couverte quand elle tombe — et jamais comptée deux fois.</p>

<h3>L’installer comme une appli</h3><p>iPhone/iPad : ouvre le lien dans Safari → Partager → <i>Sur l’écran d’accueil</i>. Android/Chrome/Edge : menu → <i>Installer l’application</i>. Ça marche hors ligne.</p>

  'help.safe': 'Tu margen es lo que puedes gastar hoy sin poner en riesgo ninguna factura. Parte de tu cuenta corriente, aparta cada pago fijo que vence antes del cobro, una parte para las facturas grandes y los ahorros que dejas fuera — y reparte el resto entre los días hasta el cobro.',

  'guide.html': `<h3>La idea</h3><p>Un solo número — tu <b>margen</b> — te dice lo que puedes gastar hoy sin poner en riesgo una factura. Todo lo demás es opcional.</p>
<h3>Un comienzo tranquilo</h3><ol><li>Pon lo que hay en tu cuenta corriente.</li><li>Añade tu nómina habitual.</li><li>Confirma tu próximo cobro.</li><li>Añade tu primer pago fijo.</li></ol><p>Con eso ya tienes un número real. Añade más cuando quieras.</p>
<h3>Cada día (más o menos un minuto)</h3><p>Sigue el banner oscuro <b>Ahora mismo</b> — solo muestra una cosa. Anota gastos con un botón rápido, las teclas +, la voz, o <b>Ctrl/⌘ K</b> escribiendo «12 comida». Todo se puede deshacer.</p>
<h3>Facturas de cada pocos meses</h3><p>Marca <b>apartar un poco cada mes</b>. Se aparta una parte cada día, la factura está cubierta cuando llega — y nunca cuenta dos veces.</p>
<h3>Lista de espera</h3><p>¿Quieres algo? Apárcalo 48 horas. Al terminar, cómpralo o déjalo ir. Dejarlo ir cuenta como logro.</p>
<h3>¿Has estado fuera?</h3><p>Tras una semana o más, la agenda te ofrece tres pasitos para ponerte al día — o empezar limpio desde hoy. Sin culpa, sin atrasos.</p>
<h3>Instálala como una app</h3><p>iPhone/iPad: abre el enlace en Safari → Compartir → <i>Añadir a pantalla de inicio</i>. Android/Chrome/Edge: menú → <i>Instalar aplicación</i>. Funciona sin conexión.</p>
<h3>Tus datos</h3><p>Todo se queda en este navegador, en este dispositivo — sin cuenta, sin banco, sin rastreo. Descarga una copia de vez en cuando (Ajustes → Copia). Borrar los datos del navegador borra la agenda.</p>`

/* =====================================================================
   6. ENGINE — schedules, the number, summaries, debt plan, wins
   ===================================================================== */
function occ(s, from, to) {
  const out = [];
  if (!s || from > to) return out;
  const F = parseISO(from), T = parseISO(to);
  const atDay = (y, m, day) => { const d = new Date(y, m, Math.min(Math.max(1, +day || 1), dim(y, m))); if (d >= F && d <= T) out.push(iso(d)); };
  switch (s.type) {
    case 'monthly': case 'twice': {
      let y = F.getFullYear(), m = F.getMonth();
      while (new Date(y, m, 1) <= T) {
        atDay(y, m, s.day);
        if (s.type === 'twice') atDay(y, m, s.day2);
        if (++m > 11) { m = 0; y++; }
      }
      break;
    }
    case 'weekly': case 'biweekly': {
      const step = s.type === 'weekly' ? 7 : 14;
      let d = addDays(s.anchor, Math.ceil(diffDays(s.anchor, from) / step) * step);
      while (d <= to) { if (d >= from) out.push(d); d = addDays(d, step); }
      break;
    }
    case 'months': {
      const a = parseISO(s.anchor), n = Math.max(1, +s.n || 1), day = a.getDate();
      let i = (F.getFullYear() - a.getFullYear()) * 12 + F.getMonth() - a.getMonth();
      i = Math.floor(i / n) * n - n;
      for (let guard = 0; guard < 400; guard++, i += n) {
        const mi = a.getMonth() + i, y = a.getFullYear() + Math.floor(mi / 12), m = ((mi % 12) + 12) % 12;
        const d = new Date(y, m, Math.min(day, dim(y, m)));
        if (d > T) break;
        if (d >= F) out.push(iso(d));
      }
      break;
    }
    case 'once': if (s.date >= from && s.date <= to) out.push(s.date); break;
  }
  return [...new Set(out)].sort();
}
const shiftWeekend = d => { const w = parseISO(d).getDay(); return w === 6 ? addDays(d, -1) : w === 0 ? addDays(d, -2) : d; };
function incomeOcc(inc, from, to) {
  if (!inc.sched || inc.sched.type === 'irregular') return [];
  let ds = occ(inc.sched, addDays(from, -3), addDays(to, 3));
  if (inc.early) ds = ds.map(shiftWeekend);
  return [...new Set(ds)].filter(d => d >= from && d <= to).sort();
}
const incNet = inc => r2(inc.amount * (1 - (+inc.pct || 0) / 100));
function nextPayday(day, s = state) {
  let best = null;
  for (const inc of s.incomes) {
    const d = incomeOcc(inc, addDays(day, 1), addDays(day, 70))[0];
    if (d && (!best || d < best.date)) best = { date: d, inc };
  }
  return best;
}
function allBills(s = state) {
  return [...s.bills, ...s.debts.filter(d => d.min > 0 && d.balance > 0).map(d => ({
    id: 'd:' + d.id, debtId: d.id, name: d.name, amount: Math.min(d.min, d.balance), sched: { type: 'monthly', day: d.day || 1 }, since: d.since, debt: true
  }))];
}
const billKey = (b, d) => b.id + '|' + d;
const isPaid = (b, d) => !!state.paid[billKey(b, d)];
function cycleAround(b, day) {
  const span = Math.max(40, (+b.sched.n || 1) * 31 + 10);
  return { prev: occ(b.sched, addDays(day, -span), day).pop(), next: occ(b.sched, addDays(day, 1), addDays(day, span))[0] };
}

/* The one number. Everything that touches it lives here. */
function calc(day = todayISO()) {
  const S = state, m = S.money, bTs = m.balanceTs || 0, bDate = m.balanceDate || day;
  const r = { ready: bTs > 0, start0: +m.balance || 0, bDate, day };
  let bal = r.start0, todaySp = 0, spentSince = 0, inSince = 0, paidSince = 0, movedSince = 0;
  for (const s of S.spends) {
    if (s.ts <= bTs || s.date < bDate || s.date > day) continue;
    if (s.date === day) todaySp += s.amount; else { bal -= s.amount; spentSince += s.amount; }
  }
  for (const inc of S.incomes) for (const d of incomeOcc(inc, addDays(bDate, 1), day)) {
    const mk = S.incomeMarks[inc.id + '|' + d];
    if (mk && mk.status === 'late') continue;
    const a = mk && mk.amount != null ? mk.amount : incNet(inc);
    bal += a; inSince += a;
  }
  for (const k in S.incomeMarks) {
    const mk = S.incomeMarks[k], d = k.split('|')[1];
    if (mk.status === 'arrived' && mk.ts > bTs && d <= bDate) { bal += mk.amount; inSince += mk.amount; }
  }
  for (const x of S.moneyIn) if (x.ts > bTs && x.date >= bDate && x.date <= day) { bal += x.amount; inSince += x.amount; }
  for (const p of Object.values(S.paid)) if (p.ts > bTs && !p.card) { bal -= p.amount; paidSince += p.amount; }
  for (const d of S.debts) for (const l of d.log) if (l.kind === 'extra' && l.ts > bTs) { bal -= l.amount; paidSince += l.amount; }
  for (const g of S.goals) if (!g.keepOut) for (const l of g.log) if (l.ts > bTs) { bal -= l.amount; movedSince += l.amount; }

  const np = nextPayday(day);
  const horizon = np ? np.date : addDays(day, 14);
  const days = Math.max(1, diffDays(day, horizon));
  const due = [], held = [];
  for (const b of allBills()) {
    if (b.card) continue;
    const from = maxISO(b.since || '2000-01-01', addDays(day, -45));
    const ds = occ(b.sched, from, addDays(horizon, -1)).filter(d => !isPaid(b, d));
    if (ds.length) for (const d of ds) due.push({ b, d, amount: b.amount });
    else if (b.smooth) {
      const { prev, next } = cycleAround(b, day);
      if (prev && next) held.push({ b, next, amount: r2(b.amount * clamp(diffDays(prev, day) / diffDays(prev, next), 0, 1)) });
    }
  }
  due.sort((a, b) => (a.d < b.d ? -1 : 1));
  const keepOut = sum(S.goals.filter(g => g.keepOut), g => g.saved);
  const setAside = +m.setAside || 0;
  const dueSum = sum(due, x => x.amount), heldSum = sum(held, x => x.amount);
  const available = bal - dueSum - heldSum - keepOut - setAside;
  const start = available / days;
  return Object.assign(r, { bal, todaySp, spentSince, inSince, paidSince, movedSince, np, horizon, days, due, held, keepOut, setAside, dueSum, heldSum, available, start, safe: start - todaySp });
}

function monthSummary(ym) {
  const T = todayISO(), from = ym + '-01', to = monthEnd(from);
  const inArr = [], outArr = [];
  for (const inc of state.incomes) for (const d of incomeOcc(inc, from, to)) {
    const mk = state.incomeMarks[inc.id + '|' + d];
    const status = mk && mk.status === 'late' ? 'late' : (mk && mk.status === 'arrived') || d <= T ? 'arrived' : 'coming';
    inArr.push({ kind: 'inc', inc, d, amount: mk && mk.amount != null ? mk.amount : incNet(inc), status, name: inc.name });
  }
  for (const x of state.moneyIn) if (x.date >= from && x.date <= to) inArr.push({ kind: 'one', x, d: x.date, amount: x.amount, status: 'arrived', name: x.name });
  const groups = Object.fromEntries(GROUPS.map(g => [g, 0]));
  for (const s of state.spends) if (s.date >= from && s.date <= to) { const g = catOf(s.cat).group || 'living'; groups[g] += s.amount; outArr.push({ kind: 'spend', s, d: s.date, amount: s.amount, name: s.note || catName(catOf(s.cat)) }); }
  let stillOut = 0;
  for (const b of allBills()) for (const d of occ(b.sched, maxISO(from, b.since || from), to)) {
    const p = state.paid[billKey(b, d)];
    if (p) { if (!p.card) { groups[b.debt ? 'debt' : 'home'] += p.amount; outArr.push({ kind: 'bill', b, d, amount: p.amount, name: b.name }); } }
    else if (!b.card) stillOut += b.amount;
  }
  for (const db of state.debts) for (const l of db.log) if (l.kind === 'extra' && l.date >= from && l.date <= to) { groups.debt += l.amount; outArr.push({ kind: 'extra', d: l.date, amount: l.amount, name: db.name }); }
  for (const g of state.goals) for (const l of g.log) if (l.date >= from && l.date <= to) { groups.savings += l.amount; outArr.push({ kind: 'goal', d: l.date, amount: l.amount, name: g.name }); }
  const cameIn = sum(inArr.filter(x => x.status === 'arrived'), x => x.amount);
  const wentOut = sum(Object.values(groups));
  return { from, to, inArr, outArr, groups, cameIn, wentOut, kept: cameIn - wentOut, stillOut, coming: sum(inArr.filter(x => x.status === 'coming'), x => x.amount), late: sum(inArr.filter(x => x.status === 'late'), x => x.amount) };
}

function debtSim(order, extra) {
  const ds = state.debts.filter(d => d.balance > 0).map(d => ({ id: d.id, bal: +d.balance, rate: +d.rate || 0, min: +d.min || 0, interest: 0, clear: null }));
  if (!ds.length) return { list: [], months: 0, interest: 0, rank: [] };
  const rank = [...ds].sort(order === 'snowball' ? (a, b) => a.bal - b.bal : (a, b) => b.rate - a.rate || a.bal - b.bal).map(d => d.id);
  const budget = sum(ds, d => d.min) + (+extra || 0);
  let month = 0;
  while (ds.some(d => d.bal > 0.005) && month < 600) {
    month++;
    for (const d of ds) if (d.bal > 0) { const i = d.bal * d.rate / 1200; d.bal += i; d.interest += i; }
    let pool = budget;
    for (const d of ds) if (d.bal > 0) { const p = Math.min(d.min, d.bal, pool); d.bal -= p; pool -= p; }
    for (const id of rank) { const d = ds.find(x => x.id === id); if (d.bal > 0 && pool > 0) { const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; } }
    for (const d of ds) if (d.bal <= 0.005 && !d.clear) { d.bal = 0; d.clear = month; }
  }
  return { list: ds, months: month, interest: sum(ds, d => d.interest), rank, stuck: month >= 600 };
}

function winsList() {
  const S = state, T = todayISO();
  const days = [...new Set(S.spends.map(s => s.date))].sort();
  const first = days[0];
  let noSpend = false;
  if (first) for (let d = first; d < T; d = addDays(d, 1)) if (!days.includes(d)) { noSpend = true; break; }
  let billsMonth = false, blackMonth = false;
  for (let i = 1; i <= 6; i++) {
    const ym = addMonths(monthStart(T), -i).slice(0, 7), from = ym + '-01', to = monthEnd(from);
    let n = 0, ok = true;
    for (const b of allBills()) for (const d of occ(b.sched, maxISO(from, b.since || from), to)) { n++; if (!isPaid(b, d)) ok = false; }
    if (n && ok) billsMonth = true;
    const ms = monthSummary(ym);
    if (ms.cameIn > 0 && ms.kept >= 0) blackMonth = true;
  }
  const saved = sum(S.goals, g => g.saved);
  return [
    { id: 'first', got: S.spends.length > 0 },
    { id: 'seven', got: days.length >= 7 },
    { id: 'nospend', got: noSpend },
    { id: 'billsmonth', got: billsMonth },
    { id: 'black', got: blackMonth },
    { id: 'thousand', got: saved >= 1000, v: { x: money(1000, true) } },
    { id: 'goal', got: S.goals.some(g => g.saved >= g.target && g.target > 0) },
    { id: 'letgo', got: S.wait.some(w => w.status === 'letgo') },
    { id: 'minutes', got: S.minutes.length >= 5 },
    { id: 'extra', got: S.debts.some(d => d.log.some(l => l.kind === 'extra')) }
  ];
}

function renderMonth() {
  const T = todayISO();
  const ym = ui.ym || T.slice(0, 7);
  const first = ym + '-01', last = monthEnd(first), d0 = parseISO(first);
  const ms = monthSummary(ym);
  const isNow = ym === T.slice(0, 7);
  const np = nextPayday(T);
  const status = isNow ? (np ? t('month.statusNow', { n: diffDays(T, np.date) }) : t('month.inProgress')) : ym < T.slice(0, 7) ? t('month.past') : t('month.ahead');

function billRows() {
  const T = todayISO(), c = calc(), ms = monthStart(T), me = monthEnd(T), rows = [];
  for (const b of allBills()) {
    const from = maxISO(b.since || '2000-01-01', minISO(ms, addDays(T, -45)));
    let ds = occ(b.sched, from, me).filter(d => d >= ms || !isPaid(b, d));
    if (!ds.some(d => !isPaid(b, d))) { const n = occ(b.sched, addDays(maxISO(T, me), 1), addDays(T, 400))[0]; if (n) ds.push(n); }
    for (const d of ds) { const paid = isPaid(b, d); rows.push({ b, d, paid, status: paid ? 'paid' : d < c.horizon ? 'topay' : 'later' }); }
  }
  return rows.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
}

      </section>

function yearly(b) {
  const s = b.sched;
  const per = { monthly: 12, twice: 24, weekly: 52, biweekly: 26, months: 12 / (s.n || 1), once: 1 }[s.type] || 12;

function goalPace(g) {
  const left = Math.max(0, g.target - g.saved);
  if (!left) return { left, per: 0, reach: null };
  if (g.date) { const m = Math.max(1, (parseISO(g.date + '-01').getFullYear() - new Date().getFullYear()) * 12 + parseISO(g.date + '-01').getMonth() - new Date().getMonth()); return { left, per: left / m, reach: g.date }; }
  return { left, per: null, reach: null };
}
function renderGoals() {

      </div></section>
    <div class="s12 cards">${G.map(g => { const p = goalPace(g), pc = g.target ? clamp(100 * g.saved / g.target, 0, 100) : 0, reached = g.saved >= g.target && g.target > 0; return `<section class="card goal">

  const owed = sum(state.debts, d => d.balance), T = todayISO();
  const clearYM = sim.months ? addMonths(T, sim.months).slice(0, 7) : null;
  const cheaper = Math.abs(sim.interest - other.interest) < 1 ? 'same' : sim.interest < other.interest ? 'this' : 'other';
  const ordered = sim.rank.map(id => state.debts.find(d => d.id === id)).concat(state.debts.filter(d => !(d.balance > 0)));
  return `${screenHead(t('debt.title'), t('debt.sub'), `<button class="btn primary" data-act="debt-new">${icon('plus')} ${t('debt.add')}</button>`)}

function renderEnvelopes() {
  const ym = todayISO().slice(0, 7);
  const spentBy = {};
  for (const s of state.spends) if (s.date.startsWith(ym)) spentBy[s.cat] = (spentBy[s.cat] || 0) + s.amount;
  const caps = Object.entries(state.envelopes).filter(([, v]) => v > 0);
  const left = sum(caps, ([k, v]) => Math.max(0, v - (spentBy[k] || 0)));
  const uncapped = state.cats.filter(c => !(state.envelopes[c.id] > 0) && spentBy[c.id]);
  return `${screenHead(t('env.title'), t('env.sub'), `<button class="btn primary" data-act="env-edit">${icon('edit')} ${t('env.edit')}</button>`)}
  <div class="grid">
    <section class="card s12 hero" style="padding:22px 26px"><div class="row between"><div class="label">${t('env.left')}</div>${help('envelopes')}</div>
      <div class="big num" style="font-size:clamp(2.6rem,5vw,3.8rem)">${bigMoney(left)}</div><p class="soft">${t('env.leftSub', { m: esc(fdate(ym + '-01', 'month')) })}</p></section>
    <div class="s12 cards" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${caps.map(([k, cap]) => { const sp = spentBy[k] || 0, rem = cap - sp, pc = clamp(100 * rem / cap, 0, 100); return `<section class="card" style="padding:14px">
      <div class="jar" style="${catStyle(k)}"><div class="fill" style="height:${pc}%"></div><div class="in"><div><b class="num">${esc(moneyR(Math.max(0, rem)))}</b><small>${t('env.leftOf', { x: esc(moneyR(cap)) })}</small></div></div></div>
      <div class="row between" style="margin-top:10px">${chip(k)}<span class="muted num">${esc(moneyR(sp))}</span></div>

}

let lastFocus = null;
function openSheet(html, { wide = false, onOpen } = {}) {
  closeSheet(true);
  lastFocus = document.activeElement;
  const layer = $('#layer');
  layer.innerHTML = `<div class="layer" data-act="scrim"><div class="sheet ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add('has-layer');
  const f = layer.querySelector('[autofocus]') || layer.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea,button');
  if (f) setTimeout(() => f.focus(), 30);
  if (onOpen) onOpen(layer.querySelector('.sheet'));
}
function closeSheet(silent) {
  const layer = $('#layer');
  if (!layer.innerHTML) return;
  layer.innerHTML = '';
  document.body.classList.remove('has-layer');
  if (ui.minute && ui.minute.timer) { clearInterval(ui.minute.timer); ui.minute = null; }
  if (ui.rec) { try { ui.rec.stop(); } catch (e) {} ui.rec = null; }
  if (!silent && lastFocus && lastFocus.isConnected) lastFocus.focus();
}
const sheetHead = (title, sub = '') => `<div class="sheet-h"><div><h2>${title}</h2>${sub ? `<p class="soft">${sub}</p>` : ''}</div><button class="ibtn" data-act="close" aria-label="${t('close')}">${icon('x')}</button></div>`;
function confirmSheet(title, sub, yesLabel, onYes) {
  ui.onYes = onYes;
  openSheet(`${sheetHead(title, sub)}<div class="sheet-f"><button class="btn ghost" data-act="close">${t('cancel')}</button><button class="btn primary" data-act="yes">${yesLabel}</button></div>`);
}

function schedFields(s, kinds) {

  return `<label class="field"><span>${t('f.how')}</span><select class="input" name="stype" data-act="stype">${kinds.map(k => opt(k, t('sk.' + k), s.type)).join('')}</select></label>

      <label class="field" data-for="twice" ${show('twice')}><span>${t('f.day2')}</span><input class="input" name="day2" type="number" min="1" max="31" value="${s.day2 || 15}"></label>
      <label class="field" data-for="weekly biweekly months" ${['weekly', 'biweekly', 'months'].includes(s.type) ? '' : 'hidden'}><span>${t('f.anchor')}</span><input class="input" type="date" name="anchor" value="${s.anchor || T}"></label>
      <label class="field" data-for="months" ${show('months')}><span>${t('f.every')}</span><select class="input" name="n">${[2, 3, 4, 6, 12].map(n => opt(n, t('s.everyN', { n }), s.n || 6)).join('')}</select></label>
      <label class="field" data-for="once" ${show('once')}><span>${t('f.date')}</span><input class="input" type="date" name="date" value="${s.date || T}"></label>
    </div>`;
}
function readSched(f) {
  const type = f.get('stype');
  const s = { type };
  if (type === 'monthly' || type === 'twice') s.day = clamp(parseInt(f.get('day'), 10) || 1, 1, 31);
  if (type === 'twice') s.day2 = clamp(parseInt(f.get('day2'), 10) || 15, 1, 31);
  if (['weekly', 'biweekly', 'months'].includes(type)) s.anchor = f.get('anchor') || todayISO();
  if (type === 'months') s.n = +f.get('n') || 6;
  if (type === 'once') s.date = f.get('date') || todayISO();
  return s;
}

/* --- Quick actions palette (Ctrl/⌘ K) --- */
function parseQuick(text) {
  const s = String(text || '').toLowerCase().trim();
  const m = s.match(/\d+(?:[.,]\d{1,2})?/);
  if (!m) return null;
  const amount = parseAmt(m[0]);
  const rest = (s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length)).replace(/[€$£¥₹]|\b(euros?|dollars?|bucks|pounds?|eur|usd|gbp)\b/g, ' ').replace(/\s+/g, ' ').trim();
  const c = matchCat(rest);
  return { amount, cat: c ? c.id : 'other', note: c ? '' : rest };
}
function matchCat(words) {
  if (!words) return null;
  const w = words.toLowerCase();
  for (const c of state.cats) { const n = catName(c).toLowerCase(); if (n && (w.includes(n) || (w.length > 2 && n.startsWith(w)))) return c; }
  for (const c of state.cats) if ((SYN[c.id] || []).some(x => w.includes(x))) return c;
  return null;
}

  const cmds = [
    ...ALL_NAV.concat(['settings']).map(id => ({ icon: NAV[id], label: t('nav.' + id), hint: t('pal.go'), run: () => { closeSheet(); go(id); } })),

function celebrate(el) {

  const x = r.left + r.width / 2, y = r.top + r.height / 2, colors = Object.values(SWATCH).map(s => s[2]);

    p.className = 'confetto';

}

function chime() {
  if (!state.settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 783.99].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime + i * 0.12;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + 0.55);

}

  'bk-json': () => backupJSON(),
  'bk-csv': () => backupCSV(),
  'bk-enc': () => openEncrypt(),
  'start-fresh': () => startFresh(),
  'load-demo': () => confirmSheet(t('demo.loadQ'), t('demo.loadSub'), t('bk.demo'), () => { snapshot(); state = buildDemo(state); commit(); }),
  wipe: () => confirmSheet(t('wipe.title'), t('wipe.sub'), t('bk.wipe'), () => { snapshot(); state = emptyState(); LANG = state.settings.lang; commit(); }),
  'away-close': () => { ui.awayDone = true; render(); },
  'away-fresh': () => {
    snapshot();
    const from = addDays(ui.prevOpen, 1), T = todayISO();
    for (const b of allBills()) for (const d of occ(b.sched, maxISO(from, b.since || from), T)) if (!isPaid(b, d)) state.paid[billKey(b, d)] = { ts: 0, amount: b.amount, card: !!b.card, fresh: true };
    ui.awayDone = true; save(); openBalance();
  }
};
function setBalance(v) { state.money.balance = r2(v); state.money.balanceTs = Date.now(); state.money.balanceDate = todayISO(); }
function checkOnboard(el) {
  const S = state;
  if (!S.settings.onboarded && S.money.balanceTs > 0 && S.incomes.length && S.settings.paydayOk && S.bills.length) {
    S.settings.onboarded = true; celebrate(el); setTimeout(() => toast(t('ob.done'), false), 400);
  }
}

/* --- Forms --- */
const FORMS = {
  log: (f, form) => {
    const amount = parseAmt(f.get('amount'));
    const ok = addSpend({ id: ui.log.id, amount: isNaN(amount) ? ui.log.amount : amount, cat: ui.log.cat, date: f.get('date') || todayISO(), note: (f.get('note') || '').trim() }, form.querySelector('.btn.primary'));
    if (ok) closeSheet();
  },
  balance: (f, form) => {
    const v = parseAmt(f.get('balance'));
    if (isNaN(v)) { toast(t('log.needAmount'), false); return; }
    snapshot(); setBalance(v); state.money.setAside = Math.max(0, parseAmt(f.get('setAside')) || 0);
    if (!state.tasks.done.includes('balance')) state.tasks.done.push('balance');
    celebrate(form.querySelector('.btn.primary')); checkOnboard(); closeSheet(); commit(); toast(t('toast.balance'), true);
  },
  bill: (f, form) => {
    const id = form.dataset.id, amount = parseAmt(f.get('amount'));
    if (!(amount > 0)) { toast(t('log.needAmount'), false); return; }
    snapshot();
    const data = { name: f.get('name').trim(), amount: r2(amount), sched: readSched(f), smooth: !!f.get('smooth'), card: !!f.get('card'), review: !!f.get('review') };
    if (id) Object.assign(state.bills.find(b => b.id === id), data);
    else state.bills.push({ id: uid(), since: todayISO(), ...data });
    checkOnboard(form.querySelector('.btn.primary')); closeSheet(); commit(); toast(t('toast.saved'), true);
  },
  income: (f, form) => {
    const id = form.dataset.id, amount = parseAmt(f.get('amount'));
    if (!(amount > 0)) { toast(t('log.needAmount'), false); return; }
    snapshot();
    const data = { name: f.get('name').trim(), amount: r2(amount), sched: readSched(f), early: !!f.get('early'), pct: clamp(+f.get('pct') || 0, 0, 100) };
    if (id) Object.assign(state.incomes.find(i => i.id === id), data); else state.incomes.push({ id: uid(), ...data });
    checkOnboard(); closeSheet(); commit(); toast(t('toast.saved'), true);
  },
  moneyin: f => {
    const amount = parseAmt(f.get('amount'));
    if (!(amount > 0)) { toast(t('log.needAmount'), false); return; }
    snapshot(); state.moneyIn.push({ id: uid(), name: f.get('name').trim(), amount: r2(amount), date: f.get('date') || todayISO(), ts: Date.now() });
    closeSheet(); commit(); toast(t('toast.saved'), true);
  },
  goal: f => {
    const id = f.get('__id');
    const target = parseAmt(f.get('target'));
    if (!(target > 0)) { toast(t('log.needAmount'), false); return; }
    snapshot();
    const data = { name: f.get('name').trim(), target: r2(target), saved: r2(parseAmt(f.get('saved')) || 0), date: f.get('date') || '', color: f.get('color') || 'sage', keepOut: !!f.get('keepOut') };
    if (id) Object.assign(state.goals.find(g => g.id === id), data); else state.goals.push({ id: uid(), log: [], ...data });
    closeSheet(); commit(); toast(t('toast.saved'), true);
  },
  'goal-put': (f, form) => {
    const v = parseAmt(f.get('amount'));
    if (!v) return;
    const g = state.goals.find(x => x.id === form.dataset.id), was = g.saved >= g.target;
    snapshot();
    g.saved = r2(Math.max(0, g.saved + v));
    g.log.push({ amount: r2(v), date: todayISO(), ts: Date.now() });
    if (!was && g.saved >= g.target) { celebrate(form); setTimeout(() => toast(t('goals.reachedToast', { n: g.name }), false), 300); }
    else celebrate(form);
    commit(); if (was || g.saved < g.target) toast(t('toast.put', { x: money(v), n: g.name }), true);
  },
  debt: f => {
    const id = f.get('__id'), bal = parseAmt(f.get('balance'));
    if (isNaN(bal)) { toast(t('log.needAmount'), false); return; }
    snapshot();
    const data = { name: f.get('name').trim(), balance: r2(bal), rate: parseAmt(f.get('rate')) || 0, min: r2(parseAmt(f.get('min')) || 0), day: clamp(parseInt(f.get('day'), 10) || 1, 1, 31) };
    if (id) Object.assign(state.debts.find(d => d.id === id), data); else state.debts.push({ id: uid(), since: todayISO(), log: [], ...data });
    closeSheet(); commit(); toast(t('toast.saved'), true);
  },
  'debt-pay': (f, form) => {
    const v = parseAmt(f.get('amount'));
    if (!(v > 0)) { toast(t('log.needAmount'), false); return; }
    const d = state.debts.find(x => x.id === form.dataset.id);
    snapshot(); d.balance = r2(Math.max(0, d.balance - v)); d.log.push({ id: uid(), amount: r2(v), date: f.get('date') || todayISO(), ts: Date.now(), kind: 'extra' });
    celebrate(form.querySelector('.btn.primary')); closeSheet(); commit(); toast(t('toast.debtPay', { x: money(v) }), true);
  },
  'debt-extra': f => { state.debtPlan.extra = Math.max(0, parseAmt(f.get('extra')) || 0); commit(); toast(t('toast.saved'), false); },
  env: f => { snapshot(); for (const c of state.cats) { const v = parseAmt(f.get(c.id)); if (v > 0) state.envelopes[c.id] = r2(v); else delete state.envelopes[c.id]; } closeSheet(); commit(); toast(t('toast.saved'), true); },
  cat: f => {
    const id = f.get('__id');
    snapshot();
    if (id) { const c = state.cats.find(x => x.id === id); const nm = f.get('name').trim(); c.name = nm === t('cat.' + id) ? null : nm; c.group = f.get('group'); c.color = f.get('color') || c.color; }
    else state.cats.push({ id: 'c' + uid(), name: f.get('name').trim(), group: f.get('group'), color: f.get('color') || 'sky' });
    closeSheet(); commit();
  },
  quick: f => { snapshot(); state.quick = [0, 1, 2].map(i => ({ cat: f.get('cat' + i), amount: r2(parseAmt(f.get('amt' + i)) || 0) })).filter(q => q.amount > 0); closeSheet(); commit(); },
  dump: (f, form) => { const txt = (f.get('text') || '').trim(); if (!txt) return; state.dump.push({ id: uid(), text: txt, ts: Date.now() }); commit(); const i = $('[data-form=dump] input'); if (i) i.focus(); },
  note: (f, form) => { const txt = (f.get('text') || '').trim(); if (!txt) return; const ym = form.dataset.ym; (state.notes[ym] = state.notes[ym] || []).push({ id: uid(), text: txt, ts: Date.now() }); commit(); toast(t('notes.kept'), false); },
  wait: (f, form) => {
    const price = parseAmt(f.get('price'));
    if (!(price > 0)) { toast(t('log.needAmount'), false); return; }
    const item = f.get('item').trim();
    state.wait.push({ id: uid(), item, price: r2(price), cat: (matchCat(item) || { id: 'other' }).id, ts: Date.now(), hours: +f.get('hours') || 48, status: 'waiting' });
    commit(); toast(t('wait.started'), false);
  },
  group: (f, form) => { const v = (f.get('name') || '').trim(); state.groupNames[form.dataset.g] = v && v !== t('grp.' + form.dataset.g) ? v : undefined; closeSheet(); commit(); },
  'set-you': f => {
    const S = state.settings;
    S.name = (f.get('name') || '').trim(); S.title = (f.get('title') || '').trim(); S.reminder = f.get('reminder') || ''; S.help = !!f.get('help');
    const lang = f.get('lang');
    if (lang && lang !== S.lang) {
      const oldTitle = t('demo.title');
      S.lang = lang; LANG = lang;
      if (state.demo) { // example data follows the language, so it never reads half-translated
        if (S.title === oldTitle) S.title = '';
        const name = S.name;
        state = buildDemo(state);
        Object.assign(state.settings, { name, title: state.settings.title || t('demo.title'), currency: lang === 'en' ? 'USD' : 'EUR' });
      }
    }
    commit(); toast(t('toast.saved'), false);
  },
  'set-money': f => {
    const v = parseAmt(f.get('balance'));
    snapshot();
    if (!isNaN(v) && (!state.money.balanceTs || Math.abs(v - calc().bal) > 0.004)) setBalance(v);
    state.money.setAside = Math.max(0, parseAmt(f.get('setAside')) || 0);
    state.settings.currency = f.get('currency'); state.settings.weekStart = +f.get('weekStart');
    checkOnboard(); commit(); toast(t('toast.saved'), true);
  },
  enc: async f => {
    if (f.get('pass') !== f.get('pass2')) { toast(t('bk.mismatch'), false); return; }
    try { const out = await encryptText(JSON.stringify({ app: 'breathing-room', v: 1, state }), f.get('pass')); download(`breathing-room-locked-${stamp()}.json`, out); closeSheet(); toast(t('bk.done'), false); }
    catch (e) { toast(t('bk.noCrypto'), false); }
  },
  dec: async f => {
    try { const txt = await decryptText(ui.pendingEnc, f.get('pass')); closeSheet(true); restoreFrom(txt); }
    catch (e) { toast(t('bk.wrongPass'), false); }
  }
};

/* =====================================================================
   22. RENDER & INIT
   ===================================================================== */
const SCREENS = { today: renderToday, month: renderMonth, bills: renderBills, income: renderIncome, goals: renderGoals, debt: renderDebt, envelopes: renderEnvelopes, wait: renderWait, wins: renderWins, settings: renderSettings };
function applyLook() {
  const S = state.settings, root = document.documentElement;
  const th = S.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'linen') : S.theme;
  root.dataset.theme = th;
  root.dataset.motion = S.motion;
  root.style.setProperty('--scale', S.scale || 1);
  root.lang = S.lang;
  document.body.classList.toggle('focus', ui.focus);
  const mc = $('meta[name=theme-color]'); if (mc) mc.content = th === 'night' ? '#111816' : '#F6F2EA';
}
function render() {
  LANG = state.settings.lang;
  applyLook();
  $('#side').innerHTML = renderSide();
  $('#top').innerHTML = renderTop();
  $('#ribbon').innerHTML = renderRibbon();
  $('#tabbar').innerHTML = renderTabbar();
  $('#rail').innerHTML = renderRail();
  $('#fab').innerHTML = `${icon('plus')} ${t('logSpend')}`;
  $('#view').innerHTML = (SCREENS[ui.screen] || renderToday)();
  document.title = `${t('nav.' + ui.screen)} · ${t('brand')}`;
}

function bind() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type === 'file')) return;
    if (el.dataset.act === 'scrim') { if (e.target === el) closeSheet(); return; }
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    if (el.tagName !== 'INPUT') e.preventDefault();
    fn(el.dataset, el, e);
  });
  document.addEventListener('submit', e => {
    const form = e.target.closest('[data-form]');
    if (!form) return;
    e.preventDefault();
    const f = new FormData(form);
    if (form.dataset.id !== undefined) f.set('__id', form.dataset.id);
    const fn = FORMS[form.dataset.form];
    if (fn) fn(f, form);
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'log-amt') { const v = parseAmt(e.target.value); ui.log.amount = isNaN(v) ? 0 : v; syncLogBig(); }
    if (e.target.id === 'pal-in') { ui.pal.items = palItems(e.target.value); ui.pal.i = 0; drawPal(); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.name === 'stype') { const form = el.closest('form'); $$('[data-for]', form).forEach(x => { x.hidden = !x.dataset.for.split(' ').includes(el.value); }); }
    if (el.dataset.act === 'bk-restore' && el.files[0]) { const r = new FileReader(); r.onload = () => restoreFrom(r.result); r.readAsText(el.files[0]); el.value = ''; }
  });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
    if (e.key === 'Escape' && $('#layer').innerHTML) { closeSheet(); return; }
    if (e.target.id === 'pal-in' && ui.pal) {
      if (e.key === 'ArrowDown') { e.preventDefault(); ui.pal.i = Math.min(ui.pal.items.length - 1, ui.pal.i + 1); drawPal(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); ui.pal.i = Math.max(0, ui.pal.i - 1); drawPal(); }
      if (e.key === 'Enter') { e.preventDefault(); const x = ui.pal.items[ui.pal.i]; if (x) x.run(); }
    }
    if (e.key === 'Tab' && $('#layer .sheet')) { // keep focus inside the sheet
      const f = $$('#layer .sheet button, #layer .sheet input:not([type=hidden]), #layer .sheet select, #layer .sheet textarea, #layer .sheet a[href]').filter(x => !x.closest('[hidden]'));
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== ui.screen && h in NAV) go(h); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (state.settings.theme === 'auto') render(); });
  window.addEventListener('storage', e => { if (e.key === STORE_KEY && e.newValue) { try { state = migrate(JSON.parse(e.newValue)); render(); } catch (_) {} } });
}

/* gentle reminder while the planner is open */
function reminderTick() {
  const r = state.settings.reminder;
  if (!r) return;
  const T = todayISO(), now = new Date(), [h, m] = r.split(':').map(Number);
  if (now.getHours() * 60 + now.getMinutes() < h * 60 + m || ui.remindedOn === T || state.tasks.date === T && state.tasks.done.includes('log') || state.spends.some(s => s.date === T)) return;
  ui.remindedOn = T;
  toast(t('remind.text'), false);
  if ('Notification' in window && Notification.permission === 'granted') { try { new Notification(t('brand'), { body: t('remind.text'), tag: 'br-remind' }); } catch (e) {} }
}

function init() {
  state = load();
  LANG = state.settings.lang;
  ui.prevOpen = state.lastOpen;
  state.lastOpen = todayISO();
  save();
  const h = location.hash.slice(1);
  if (h in NAV) ui.screen = h;
  bind();
  render();
  setInterval(() => { if (ui.screen === 'wait' && !$('#layer').innerHTML) render(); reminderTick(); }, 60000);
  setInterval(() => { if (state.tasks.date && state.tasks.date !== todayISO() && !$('#layer').innerHTML) render(); }, 300000);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && location.hostname !== '') navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('DOMContentLoaded', init);

</script>
